services:
  backend:
    build:
      context: ./backend
    container_name: websec-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      GROK_API_KEY: ${GROK_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - backend_data:/app/data
    ports:
      - "3011:3001"
    networks:
      - websec-net

  frontend:
    build:
      context: ./frontend
      args:
        # ajuste pro domínio real quando publicar (ex: https://api.websec.seudominio.com)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: websec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3010:3000"
    networks:
      - websec-net

  bot:
    build:
      context: ./bot
    container_name: websec-bot
    restart: unless-stopped
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MY_WHATSAPP_NUMBER: ${MY_WHATSAPP_NUMBER}
      REMINDER_CRON: ${REMINDER_CRON:-0 19 * * 1-5}
    volumes:
      - bot_session:/app/.wwebjs_auth
    networks:
      - websec-net
    # o bot precisa do QR code na primeira vez — veja os logs do container
    # (na aba "Logs" do container no Portainer) pra ver o QR e escanear com o WhatsApp

networks:
  websec-net:
    driver: bridge

volumes:
  backend_data:
  bot_session:
